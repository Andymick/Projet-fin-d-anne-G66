{% load static %}
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Connexion</title>
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'pages/style.css' %}">
    </head>
    <body>
        <div class="container">
            <div class="separation">
                <h1>Bon retour!</h1>
                <p>Connectez-vous pour récupérer votre compte</p>
            </div>
            <form action="{% url 'Connexion' %}" method="post">
                <h2>Veuillez remplir vos informations</h2>
                <div class="case">
                    <i class="bi bi-person"></i>
                    <input name="utilisateur" type="text" placeholder="Nom d'utilisateur" required>
                </div>
                <div class="case">
                    <i class="bi bi-lock"></i>
                    <button type="button" onclick="afficherCacher()" class="oeil">
                        <i class="bi bi-eye-slash" id="icone"></i>
                    </button>
                    <input name="password" id="mdp" placeholder="Mot de passe" required>
                </div>
                    <button type="submit" class="creation">Connexion</button>
                <button type="reset" class="Annuler">Annuler</button>
                <a href="index.html">
                    <button type="submit" onclick="window.location.href='index.html'" class="creation">Retour</button>
                </a>
            </form>
        </div>
        <script>
            function afficherCacher(){
                let mdp= document.getElementById("mdp");
                let icone= document.getElementById("icone");
                if(mdp.type==="password"){
                    mdp.type="text";
                    icone.className="bi bi-eye";
                }
                else{
                    mdp.type="password";
                    icone.className="bi bi-eye-slash";
                }
            }
        </script>
    </body>
</html>
